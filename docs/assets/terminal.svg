<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" width="960" height="556" role="img" aria-labelledby="t d">
  <title id="t">A session with mtr</title>
  <desc id="d">mtr doctor reports the GPU, the driver's CUDA and an unmodified checkout. mtr bench measures rf-detr nano: median 9.776 ms, VRAM peak 803 MiB. mtr submit sends it for review. Output shortened.</desc>
  <rect width="960" height="556" rx="12" fill="#0b1519"/>
  <rect x="0.5" y="0.5" width="959" height="555" rx="12" fill="none" stroke="#24363d"/>
  <path d="M0 12 A12 12 0 0 1 12 0 H948 A12 12 0 0 1 960 12 V40 H0 Z" fill="#13232a"/>
  <circle cx="22" cy="20" r="6" fill="#ff6b5e"/>
  <circle cx="42" cy="20" r="6" fill="#f5b43c"/>
  <circle cx="62" cy="20" r="6" fill="#5bd68a"/>
  <text x="480" y="25" text-anchor="middle" fill="#8aa3a9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5">~/runner</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5">
    <text x="24" y="72"><tspan fill="#3fd7e8">$</tspan><tspan fill="#e3eef0">&#160;./mtr&#160;doctor</tspan></text>
    <text x="24" y="96"><tspan fill="#5bd68a">ok&#160;&#160;</tspan><tspan fill="#c3d3d6">&#160;&#160;gpu&#160;0:&#160;NVIDIA&#160;GeForce&#160;RTX&#160;4090,&#160;24564&#160;MiB,&#160;compute&#160;8.9,&#160;driver&#160;580.173.02</tspan></text>
    <text x="24" y="118"><tspan fill="#5bd68a">ok&#160;&#160;</tspan><tspan fill="#c3d3d6">&#160;&#160;cuda:&#160;the&#160;driver&#160;supports&#160;CUDA&#160;up&#160;to&#160;13.0,&#160;enough&#160;for&#160;every&#160;model</tspan></text>
    <text x="24" y="140"><tspan fill="#5bd68a">ok&#160;&#160;</tspan><tspan fill="#c3d3d6">&#160;&#160;checkout:&#160;d8a40a734167,&#160;tools/measure&#160;unmodified</tspan></text>
    <text x="24" y="162"><tspan fill="#f5b43c">warn</tspan><tspan fill="#c3d3d6">&#160;&#160;inbox:&#160;not&#160;signed&#160;in:&#160;`mtr&#160;login`&#160;before&#160;`mtr&#160;submit`</tspan></text>
    <text x="24" y="184" fill="#6c8288">mtr-result:&#160;{"status":&#160;"ok",&#160;"code":&#160;"OK",&#160;"message":&#160;"Ready:&#160;1&#160;GPU(s),&#160;1&#160;warning(s)",&#160;…}</text>

    <text x="24" y="226"><tspan fill="#3fd7e8">$</tspan><tspan fill="#e3eef0">&#160;./mtr&#160;bench&#160;rf-detr&#160;--size&#160;nano</tspan></text>
    <text x="24" y="250" fill="#8aa3a9">---&#160;rf-detr&#160;/&#160;nano:&#160;check</text>
    <text x="24" y="272" fill="#8aa3a9">---&#160;rf-detr&#160;/&#160;nano:&#160;timed&#160;run</text>
    <text x="24" y="294" fill="#6c8288">…</text>
    <text x="24" y="316"><tspan fill="#c3d3d6">latency:&#160;median&#160;</tspan><tspan fill="#e3eef0" font-weight="600">9.776&#160;ms</tspan><tspan fill="#c3d3d6">,&#160;p90&#160;10.183&#160;ms&#160;(medians&#160;of&#160;3&#160;runs;&#160;spread&#160;1.3%)</tspan></text>
    <text x="24" y="338"><tspan fill="#c3d3d6">vram&#160;peak:&#160;</tspan><tspan fill="#e3eef0" font-weight="600">803&#160;MiB</tspan><tspan fill="#c3d3d6">&#160;over&#160;a&#160;858&#160;MiB&#160;baseline</tspan></text>
    <text x="24" y="360" fill="#6c8288">mtr-result:&#160;{"status":&#160;"ok",&#160;"code":&#160;"OK",&#160;"message":&#160;"All&#160;1&#160;size(s)&#160;measured",&#160;…}</text>

    <text x="24" y="402"><tspan fill="#3fd7e8">$</tspan><tspan fill="#e3eef0">&#160;./mtr&#160;submit&#160;rf-detr</tspan></text>
    <text x="24" y="426" fill="#c3d3d6">&#160;&#160;rf-detr&#160;/&#160;nano:&#160;9.776&#160;ms&#160;median,&#160;fp16,&#160;input&#160;384x384,&#160;VRAM&#160;peak&#160;803&#160;MiB</text>
    <text x="24" y="448" fill="#c3d3d6">&#160;&#160;&#160;&#160;on&#160;NVIDIA&#160;GeForce&#160;RTX&#160;4090&#160;(24564&#160;MiB,&#160;power&#160;limit&#160;450.0&#160;W),&#160;driver&#160;580.173.02</text>
    <text x="24" y="476"><tspan fill="#c3d3d6">Send&#160;them?&#160;[y/N]&#160;</tspan><tspan fill="#e3eef0">y</tspan></text>
    <text x="24" y="498"><tspan fill="#5bd68a">sent</tspan><tspan fill="#c3d3d6">&#160;rf-detr&#160;/&#160;nano:&#160;sub_3f2c9a1b7d4e5f60,&#160;pending</tspan></text>
    <text x="24" y="526" fill="#6c8288">next:&#160;`mtr&#160;submissions`&#160;shows&#160;the&#160;review's&#160;state</text>
  </g>
</svg>
