# One uv environment for the example adapters in this directory. They are not catalog models.
# They show that the same tool measures any model, whatever its task and output.
[project]
name = "mtr-measure-examples"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
  "mtr-measure",
  "torch>=2.5",
  "torchvision>=0.20",
  "pillow>=10",
]

[tool.uv]
package = false

[tool.uv.sources]
mtr-measure = { path = "..", editable = true }
