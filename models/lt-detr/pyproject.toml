# The model's uv environment. Pin the official package and torch at the versions you run,
# and commit uv.lock next to this file, so the run can be repeated.
[project]
name = "mtr-model-lt-detr"  # mtr-model-<id>
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
  "mtr-measure",
  "lightly-train==0.18.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
]

[tool.uv]
package = false

[tool.uv.sources]
mtr-measure = { path = "../../tools/measure", editable = true }

[dependency-groups]
# ONNX Runtime rows on the CPU (docs/protocol.md, "CPU rows"), installed only for `--runtime onnxruntime-cpu`: the
# extras the export notebook installs, lightly-train[onnx,onnxruntime,onnxslim].
onnxruntime = [
  "lightly-train[onnx,onnxruntime,onnxslim]==0.18.0",
  "onnxruntime==1.31.1; python_version >= '3.11'",
]
