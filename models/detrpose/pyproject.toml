# The model's uv environment. Pin the official package and torch at the versions you run,
# and commit uv.lock next to this file, so the run can be repeated.
[project]
name = "mtr-model-detrpose"  # mtr-model-<id>
version = "0.0.0"
requires-python = ">=3.11,<3.12"
# requirements.txt of the pinned checkout, with torch and torchvision pinned (it leaves them open). The README sets up
# Python 3.11.9.
dependencies = [
  "mtr-measure",
  "opencv-python",
  "transformers",
  "cloudpickle",
  "pycocotools",
  "xtcocotools",
  "omegaconf",
  "calflops",
  "iopath",
  "scipy",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "numpy==1.23.5",
]

[tool.uv]
package = false

[tool.uv.sources]
mtr-measure = { path = "../../tools/measure", editable = true }

[dependency-groups]
# ONNX Runtime rows on the CPU (docs/protocol.md, "CPU rows"), installed only for `--runtime onnxruntime-cpu`:
# tools/deployment/export_onnx.py checks the ONNX file (onnx) and simplifies it (onnxsim; --simplify defaults to on),
# torch's exporter needs onnxscript, and tools/inference/onnx_inf.py runs it with onnxruntime.
onnxruntime = [
  "onnxruntime==1.31.1",
  "onnx",
  "onnxsim",
  "onnxscript",
]
