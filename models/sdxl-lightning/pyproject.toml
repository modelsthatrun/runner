# The model's uv environment. Pin the pipeline's package and torch at the versions you run,
# and commit uv.lock next to this file, so the run can be repeated.
[project]
name = "mtr-model-sdxl-lightning"  # mtr-model-<id>
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "mtr-measure",
  "diffusers==0.42.1",
  "transformers==5.22.2",
  "accelerate==1.15.0",
  "torch==2.14.1",
]

[tool.uv]
package = false

[tool.uv.sources]
mtr-measure = { path = "../../tools/measure", editable = true }
