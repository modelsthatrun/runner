# The model's uv environment. Pin the official package and torch at the versions you run,
# and commit uv.lock next to this file, so the run can be repeated.
[project]
name = "mtr-model-yolox"  # mtr-model-<id>
version = "0.0.0"
requires-python = ">=3.10"
# The repository's requirements.txt, without onnx and onnx-simplifier, which only its export uses.
# opencv-python-headless stands in for opencv_python: the same cv2, without the GUI libraries.
dependencies = [
  "mtr-measure",
  "numpy",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "opencv-python-headless",
  "loguru",
  "tqdm",
  "thop",
  "ninja",
  "tabulate",
  "psutil",
  "tensorboard",
  "pycocotools",
]

[tool.uv]
package = false

[tool.uv.sources]
mtr-measure = { path = "../../tools/measure", editable = true }

