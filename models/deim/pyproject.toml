# The model's uv environment. Pin the official package and torch at the versions you run,
# and commit uv.lock next to this file, so the run can be repeated.
[project]
name = "mtr-model-deim"  # mtr-model-<id>
version = "0.0.0"
requires-python = ">=3.10"
# The repository's requirements.txt, and gdown for the README's Google Drive links.
dependencies = [
  "mtr-measure",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "faster-coco-eval",
  "pyyaml",
  "tensorboard",
  "scipy",
  "calflops",
  "transformers",
  "gdown",
]

[tool.uv]
package = false

[tool.uv.sources]
mtr-measure = { path = "../../tools/measure", editable = true }

[dependency-groups]
# ONNX Runtime rows on the CPU (docs/protocol.md, "CPU rows"), installed only for `--runtime onnxruntime-cpu`: what
# the README's export (onnx, onnxsim; torch's exporter needs onnxscript) and tools/inference/onnx_inf.py
# (onnxruntime, cv2) import.
onnxruntime = [
  "onnxruntime==1.31.1; python_version >= '3.11'",
  "onnx",
  "onnxsim",
  "onnxscript",
  "opencv-python-headless",
]
