# The catalog facts about one model family: names, links, licenses with their sources, and paper numbers.
# The catalog's maintainers fill it in when a model goes on the site; measuring doesn't need it, and it is
# gitignored outside _template. Every license entry needs a primary source and a check date. Never type
# measured numbers here: they come from run records in runs/<size>.json (docs/protocol.md).

id = "model-id"
name = "Model name"
summary = "One line, 160 characters max."
task = "text-to-image"
variant = "general"
use_when = ""
avoid_when = ""
alternatives = []

[links]
code = "https://github.com/owner/repo"
paper = ""
project = ""

[code_license]
spdx = ""
source = ""   # URL of the repository LICENSE file
checked = ""  # YYYY-MM-DD

# Repeat this table once per checkpoint size.
[[checkpoints]]
size = "base"
status = ""         # runs-as-is | runs-with-fixes
patch = ""          # path under fixes/ when status is runs-with-fixes
weights_url = ""
gated = false
verdict = ""        # commercial-ok | conditional | non-commercial (most restrictive of code and weights)
verdict_note = ""

[checkpoints.weights_license]
spdx = ""
source = ""   # model card or release notes for this exact checkpoint
checked = ""

[checkpoints.reported]   # remove this table if the paper reports nothing comparable
metric = ""
value = 0.0
dataset = ""
source = ""   # e.g. "paper, table 2"
# benchmark = ""   # none yet for text-to-image

# Optional: flag images by hand after looking at them against each prompt's check. Files live in outputs/<size>/<prompt-id>.webp.
# [[outputs]]
# image = "count-five-apples"   # the prompt id
# size = "base"
# failure = true
# note = "six apples"
