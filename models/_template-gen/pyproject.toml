# The model's uv environment. Pin the pipeline's package and torch at the versions you run,
# and commit uv.lock next to this file, so the run can be repeated.
[project]
name = "mtr-model-template"  # mtr-model-<id>
version = "0.0.0"
requires-python = ">=3.11"  # recent diffusers needs 3.11
dependencies = [
  "mtr-measure",
  # "diffusers==x.y.z",
  # "transformers==x.y.z",
  # "accelerate==x.y.z",
  # "torch==x.y.z",
]

[tool.uv]
package = false

[tool.uv.sources]
mtr-measure = { path = "../../tools/measure", editable = true }
